[project]
name = "tg-kit"
version = "0.1.0"
description = "Drive a Telegram user account from the command line — built for testing bots from agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ruslan Korneev", email = "shaggybackend@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.0",
    "telethon>=1.40",
    "typer>=0.12",
]

[project.optional-dependencies]
qr = ["qrcode>=7.4"]

[project.scripts]
tg = "tg_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_kit"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings where they earn it, not on every def — the house style
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "FBT001",  # typer declares boolean CLI flags as positional-or-keyword parameters
    "FBT002",  # same: a flag's default is part of its declaration
    "PLR0913", # CLI commands take one parameter per option by design
    "EM101",   # messages are built inline and short; a `msg =` line per raise adds nothing
    "TRY003",  # every error message carries the fix, so it is long on purpose
    "EM102",   # same as EM101, for f-strings
    "ANN401",  # Telethon is untyped: its objects are Any at the adapter edge (see mypy override)
    "CPY001",  # the licence lives in LICENSE, not in a header per file
    "PLR0917", # typer commands: one positional parameter per CLI option
    "TC001",   # typer reads command annotations at runtime; keep imports real
    "TC002",
    "TC003",
    "RUF001",  # ⏎ ✎ ↩ × → are the output format, not typos
    "RUF002",
    "RUF003",
    "PLC0415", # deferred imports are deliberate: keyring and the TL tables stay off the startup path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest asserts
    "PLR2004", # expected values inline in test tables
    "INP001",  # tests are not a package
    "SLF001",  # tests may look at a fake's recorded calls
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Telethon ships no type information (no py.typed); its values are Any at the
# adapter edge and narrowed there.
module = ["telethon", "telethon.*", "keyring", "qrcode"]
ignore_missing_imports = true

[tool.basedpyright]
# The gate is mypy strict; this only keeps the editor's pyright in step with it
# instead of flagging every untyped Telethon value.
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
